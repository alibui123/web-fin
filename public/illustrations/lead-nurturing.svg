<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Pattern -->
  <g opacity="0.05">
    <path d="M50 35L65 28L80 35L80 49L65 56L50 49L50 35Z" fill="url(#hex-gradient)"/>
    <path d="M120 35L135 28L150 35L150 49L135 56L120 49L120 35Z" fill="url(#hex-gradient)"/>
    <path d="M85 85L100 78L115 85L115 99L100 106L85 99L85 85Z" fill="url(#hex-gradient)"/>
    <path d="M50 135L65 128L80 135L80 149L65 156L50 149L50 135Z" fill="url(#hex-gradient)"/>
    <path d="M120 135L135 128L150 135L150 149L135 156L120 149L120 135Z" fill="url(#hex-gradient)"/>
  </g>

  <!-- Central Flow Container -->
  <path class="flow-container" 
        d="M40 100C40 65 65 40 100 40C135 40 160 65 160 100C160 135 135 160 100 160C65 160 40 135 40 100Z" 
        fill="url(#container-gradient)" 
        fill-opacity="0.05" 
        stroke="url(#container-stroke)" 
        stroke-width="2"
        stroke-dasharray="4 2"/>

  <!-- Stage Hexagons -->
  <g>
    <!-- Leads Stage -->
    <g class="stage">
      <path d="M95 40L105 35L115 40L115 50L105 55L95 50L95 40Z" fill="url(#stage-gradient-1)">
        <animate attributeName="fill-opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
      </path>
      <text x="105" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="white" style="filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.3));">Leads</text>
    </g>

    <!-- Nurturing Stage -->
    <g class="stage">
      <path d="M145 95L155 90L165 95L165 105L155 110L145 105L145 95Z" fill="url(#stage-gradient-2)">
        <animate attributeName="fill-opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      </path>
      <text x="155" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="white" style="filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.3));">Nurturing</text>
    </g>

    <!-- Qualified Stage -->
    <g class="stage">
      <path d="M95 145L105 140L115 145L115 155L105 160L95 155L95 145Z" fill="url(#stage-gradient-3)">
        <animate attributeName="fill-opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" begin="1s"/>
      </path>
      <text x="105" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="white" style="filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.3));">Qualified</text>
    </g>

    <!-- Converted Stage -->
    <g class="stage">
      <path d="M35 95L45 90L55 95L55 105L45 110L35 105L35 95Z" fill="url(#stage-gradient-4)">
        <animate attributeName="fill-opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" begin="1.5s"/>
      </path>
      <text x="45" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="white" style="filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.3));">Converted</text>
    </g>
  </g>

  <!-- Connection Lines -->
  <g stroke="url(#connection-gradient)" stroke-width="1.5" stroke-dasharray="4 2">
    <path d="M105 55C105 55 125 70 155 95">
      <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M165 105C165 105 145 130 115 145">
      <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <path d="M95 155C95 155 75 130 55 105">
      <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite" begin="1s"/>
    </path>
    <path d="M35 95C35 95 55 70 95 50">
      <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </path>
  </g>

  <!-- Flowing Particles -->
  <g>
    <circle r="3" fill="url(#particle-gradient)">
      <animateMotion path="M105 55C105 55 125 70 155 95C165 105 145 130 115 145C95 155 75 130 55 105C35 95 55 70 95 50Z" 
                     dur="6s" 
                     repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="url(#particle-gradient)">
      <animateMotion path="M105 55C105 55 125 70 155 95C165 105 145 130 115 145C95 155 75 130 55 105C35 95 55 70 95 50Z" 
                     dur="6s" 
                     repeatCount="indefinite"
                     begin="2s"/>
      <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle r="3" fill="url(#particle-gradient)">
      <animateMotion path="M105 55C105 55 125 70 155 95C165 105 145 130 115 145C95 155 75 130 55 105C35 95 55 70 95 50Z" 
                     dur="6s" 
                     repeatCount="indefinite"
                     begin="4s"/>
      <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite" begin="4s"/>
    </circle>
  </g>

  <defs>
    <linearGradient id="hex-gradient" x1="0" y1="0" x2="30" y2="30">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="container-gradient" x1="40" y1="40" x2="160" y2="160">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <linearGradient id="container-stroke" x1="40" y1="40" x2="160" y2="160">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <linearGradient id="stage-gradient-1" x1="0" y1="0" x2="20" y2="20">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <linearGradient id="stage-gradient-2" x1="0" y1="0" x2="20" y2="20">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <linearGradient id="stage-gradient-3" x1="0" y1="0" x2="20" y2="20">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <linearGradient id="stage-gradient-4" x1="0" y1="0" x2="20" y2="20">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>

    <linearGradient id="connection-gradient" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <linearGradient id="text-gradient" x1="0" y1="0" x2="0" y2="20">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <linearGradient id="particle-gradient" x1="0" y1="0" x2="6" y2="6">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>
</svg> 