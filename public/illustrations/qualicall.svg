<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Glow -->
  <circle cx="100" cy="100" r="82" fill="url(#bg-gradient)" opacity="0.12"/>
  <circle cx="100" cy="100" r="70" stroke="url(#ring-gradient)" stroke-width="3" stroke-dasharray="8 8">
    <animate attributeName="stroke-dashoffset" values="32;0" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- QA Dashboard Card -->
  <rect x="45" y="55" width="110" height="90" rx="16" fill="url(#card-gradient)" opacity="0.2"/>
  <rect x="50" y="60" width="100" height="80" rx="14" stroke="url(#card-stroke)" stroke-width="2" fill="none"/>

  <!-- Waveform Bars -->
  <g transform="translate(62, 92)">
    <rect x="0" y="18" width="8" height="22" rx="4" fill="url(#wave-gradient)">
      <animate attributeName="height" values="22;30;22" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="18;10;18" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="14" y="10" width="8" height="30" rx="4" fill="url(#wave-gradient)">
      <animate attributeName="height" values="30;18;30" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="10;22;10" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="28" y="6" width="8" height="34" rx="4" fill="url(#wave-gradient)">
      <animate attributeName="height" values="34;22;34" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="6;18;6" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="42" y="12" width="8" height="28" rx="4" fill="url(#wave-gradient)">
      <animate attributeName="height" values="28;18;28" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="12;22;12" dur="1.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="56" y="16" width="8" height="24" rx="4" fill="url(#wave-gradient)">
      <animate attributeName="height" values="24;32;24" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="16;8;16" dur="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Headset -->
  <path d="M65 78 C65 58 85 45 100 45 C115 45 135 58 135 78" stroke="url(#headset-gradient)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <rect x="56" y="78" width="16" height="24" rx="6" fill="url(#headset-gradient)"/>
  <rect x="128" y="78" width="16" height="24" rx="6" fill="url(#headset-gradient)"/>
  <path d="M144 98 C150 100 154 104 154 110" stroke="url(#headset-gradient)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- QA Check Badge -->
  <circle cx="136" cy="126" r="14" fill="url(#badge-gradient)"/>
  <path d="M130 126 L135 131 L143 121" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dasharray" values="0 30;30 0" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <defs>
    <linearGradient id="bg-gradient" x1="20" y1="20" x2="180" y2="180">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="ring-gradient" x1="40" y1="40" x2="160" y2="160">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="card-gradient" x1="50" y1="60" x2="150" y2="140">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="card-stroke" x1="50" y1="60" x2="150" y2="140">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="wave-gradient" x1="0" y1="0" x2="0" y2="40">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="headset-gradient" x1="60" y1="60" x2="140" y2="120">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="badge-gradient" x1="120" y1="116" x2="152" y2="140">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
</svg>
