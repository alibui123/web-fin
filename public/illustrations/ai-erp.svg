<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Glow -->
  <circle cx="100" cy="100" r="82" fill="url(#bg-gradient)" opacity="0.12"/>
  <circle cx="100" cy="100" r="70" stroke="url(#ring-gradient)" stroke-width="3" stroke-dasharray="6 10">
    <animate attributeName="stroke-dashoffset" values="32;0" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Server/Database Core -->
  <rect x="65" y="55" width="70" height="90" rx="10" fill="url(#hub-bg-gradient)" opacity="0.2"/>
  <rect x="70" y="60" width="60" height="80" rx="8" stroke="url(#hub-stroke)" stroke-width="2" fill="none"/>

  <!-- Server Blades / Dashboard Cards -->
  <g fill="url(#blade-gradient)">
    <rect x="78" y="70" width="44" height="16" rx="4" />
    <rect x="78" y="92" width="44" height="16" rx="4" />
    <rect x="78" y="114" width="44" height="16" rx="4" />
  </g>

  <!-- Pulsing Data Lights -->
  <g fill="url(#light-gradient)">
    <!-- Top Blade -->
    <circle cx="86" cy="78" r="3">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <rect x="96" y="76" width="18" height="4" rx="2" opacity="0.8"/>
    
    <!-- Middle Blade -->
    <circle cx="86" cy="100" r="3">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <rect x="96" y="98" width="12" height="4" rx="2" opacity="0.8"/>
    
    <!-- Bottom Blade -->
    <circle cx="86" cy="122" r="3">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <rect x="96" y="120" width="20" height="4" rx="2" opacity="0.8"/>
  </g>

  <!-- Connection Line and Satellite Node 1 -->
  <g>
    <!-- Line -->
    <path d="M130 100 Q150 100 160 85" stroke="url(#node-gradient)" stroke-width="2" stroke-dasharray="4 4" fill="none">
       <animate attributeName="stroke-dashoffset" values="8;0" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- Node -->
    <circle cx="160" cy="85" r="8" stroke="url(#node-gradient)" stroke-width="2" fill="none"/>
    <circle cx="160" cy="85" r="3" fill="url(#node-gradient)">
       <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Connection Line and Satellite Node 2 -->
  <g>
    <!-- Line -->
    <path d="M70 100 Q45 100 35 120" stroke="url(#node-gradient)" stroke-width="2" stroke-dasharray="4 4" fill="none">
       <animate attributeName="stroke-dashoffset" values="8;0" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- Node -->
    <circle cx="35" cy="120" r="8" stroke="url(#node-gradient)" stroke-width="2" fill="none"/>
    <circle cx="35" cy="120" r="3" fill="url(#node-gradient)">
       <animate attributeName="opacity" values="1;0.5;1" dur="1.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Sparkle -->
  <g transform="translate(140, 45)">
    <path d="M6 0 L8 6 L14 8 L8 10 L6 16 L4 10 L0 8 L4 6 Z" fill="url(#sparkle-gradient)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <defs>
    <linearGradient id="bg-gradient" x1="20" y1="20" x2="180" y2="180">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="ring-gradient" x1="40" y1="40" x2="160" y2="160">
      <stop offset="0%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
    <linearGradient id="hub-bg-gradient" x1="60" y1="60" x2="140" y2="155">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="hub-stroke" x1="60" y1="60" x2="140" y2="155">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#F0ABFC"/>
    </linearGradient>
    <linearGradient id="blade-gradient" x1="78" y1="70" x2="122" y2="130">
      <stop offset="0%" stop-color="#FDF4FF"/>
      <stop offset="100%" stop-color="#F5D0FE"/>
    </linearGradient>
    <linearGradient id="light-gradient" x1="86" y1="78" x2="116" y2="122">
      <stop offset="0%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="node-gradient" x1="0" y1="0" x2="20" y2="20">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="sparkle-gradient" x1="0" y1="0" x2="14" y2="16">
      <stop offset="0%" stop-color="#F0ABFC"/>
      <stop offset="100%" stop-color="#FAFAF9"/>
    </linearGradient>
  </defs>
</svg>
