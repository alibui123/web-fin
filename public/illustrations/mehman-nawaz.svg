<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Glow -->
  <circle cx="100" cy="100" r="82" fill="url(#bg-gradient)" opacity="0.12"/>
  <circle cx="100" cy="100" r="70" stroke="url(#ring-gradient)" stroke-width="3" stroke-dasharray="6 10">
    <animate attributeName="stroke-dashoffset" values="32;0" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Hotel Building -->
  <rect x="55" y="60" width="90" height="95" rx="12" fill="url(#building-gradient)" opacity="0.2"/>
  <rect x="60" y="65" width="80" height="85" rx="10" stroke="url(#building-stroke)" stroke-width="2" fill="none"/>

  <!-- Roof -->
  <path d="M55 70 L100 45 L145 70" stroke="url(#roof-gradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Windows -->
  <g fill="url(#window-gradient)">
    <rect x="72" y="80" width="12" height="12" rx="3">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="94" y="80" width="12" height="12" rx="3">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="116" y="80" width="12" height="12" rx="3">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="100" width="12" height="12" rx="3">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="94" y="100" width="12" height="12" rx="3">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="116" y="100" width="12" height="12" rx="3">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="120" width="12" height="12" rx="3">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="94" y="120" width="12" height="12" rx="3">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="116" y="120" width="12" height="12" rx="3">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Door -->
  <rect x="92" y="136" width="16" height="19" rx="4" fill="url(#door-gradient)"/>

  <!-- Key Icon -->
  <g transform="translate(24, 120)">
    <circle cx="12" cy="12" r="10" stroke="url(#key-gradient)" stroke-width="3" fill="none"/>
    <circle cx="12" cy="12" r="4" fill="url(#key-gradient)"/>
    <rect x="22" y="10" width="22" height="4" rx="2" fill="url(#key-gradient)"/>
    <rect x="36" y="7" width="6" height="4" rx="2" fill="url(#key-gradient)"/>
  </g>

  <!-- Sparkle -->
  <g transform="translate(146, 52)">
    <path d="M6 0 L8 6 L14 8 L8 10 L6 16 L4 10 L0 8 L4 6 Z" fill="url(#sparkle-gradient)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <defs>
    <linearGradient id="bg-gradient" x1="20" y1="20" x2="180" y2="180">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="ring-gradient" x1="40" y1="40" x2="160" y2="160">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="building-gradient" x1="60" y1="60" x2="140" y2="155">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="building-stroke" x1="60" y1="60" x2="140" y2="155">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="roof-gradient" x1="55" y1="45" x2="145" y2="70">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="window-gradient" x1="70" y1="80" x2="130" y2="132">
      <stop offset="0%" stop-color="#ECFEFF"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="door-gradient" x1="90" y1="136" x2="110" y2="160">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="key-gradient" x1="0" y1="0" x2="44" y2="20">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="sparkle-gradient" x1="0" y1="0" x2="14" y2="16">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>
</svg>
